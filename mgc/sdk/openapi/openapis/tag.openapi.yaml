tags:
-   name: resource-types
    description: List the resource types that support tags
-   name: resources
    description: Manage the tags attached to a resource
-   name: values
    description: Manage the values of a tag
$id: https://tag.jaxyendy.com/openapi.json
servers:
-   url: https://{env}/tags
    variables:
        env:
            description: Environment to use
            default: api.magalu.cloud
            enum:
            - api.magalu.cloud
            - api.pre-prod.jaxyendy.com
            x-mgc-transforms:
            -   type: translate
                translations:
                -   from: prod
                    to: api.magalu.cloud
                -   from: pre-prod
                    to: api.pre-prod.jaxyendy.com
