openapi: 3.0.3
info:
    title: Tags API
    description: Organize your cloud resources with tags
    contact:
        name: XPNG.CAT
        url: https://github.com/luizalabs
    version: 0.1.0
paths:
    /v0/tags:
        post:
            tags: []
            summary: Create a tag
            description: "Create a tag that can be attached to cloud resources.\n\n\
                Values can be created along with the tag. A single request accepts\
                \ at most\n100 values.\n\nRelated commands:\n  mgc tag values create\
                \ --tag-name <name>  add more values to the tag\n  mgc tag resources\
                \ tags attach            attach the tag to a resource"
            operationId: create_tags_public
            security:
            -   OAuth2:
                - tags:tags-tw
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Body_create_tags_public'
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsOutputPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
        get:
            tags: []
            summary: List all tags
            operationId: list_tags_public
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: name
                in: query
                required: false
                schema:
                    description: Name of the tag to filter by
                    title: Name
                    nullable: true
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[\w\ \-\[\]\(\)\.\:]+$
                description: Name of the tag to filter by
            -   name: color
                in: query
                required: false
                schema:
                    description: Color to filter by, as a 6-digit hex RGB code without
                        the '#' prefix
                    title: Color
                    nullable: true
                    type: string
                    minLength: 6
                    maxLength: 6
                    pattern: ^[0-9a-fA-F]+$
                    example: ffffff
                description: Color to filter by, as a 6-digit hex RGB code without
                    the '#' prefix
            -   name: kinds
                in: query
                required: false
                schema:
                    description: Kinds to filter by, such as finops
                    title: Kinds
                    nullable: true
                    type: array
                    items:
                        $ref: '#/components/schemas/TagKinds'
                    example:
                    - finops
                description: Kinds to filter by, such as finops
            -   name: _limit
                in: query
                required: false
                schema:
                    type: integer
                    maximum: 100
                    minimum: 1
                    default: 20
                    description: Maximum number of items to return per page
                description: Maximum number of items to return per page
            -   name: _offset
                in: query
                required: false
                schema:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Number of items to skip before the first result
                description: Number of items to skip before the first result
            -   name: _sort
                in: query
                required: false
                schema:
                    type: string
                    default: ''
                    description: Sort criteria for the result
                description: Sort criteria for the result
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsOutputListPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'List all tags available to you.


                Use --name, --color or --kinds to filter the result, and --control.limit

                with --control.offset to page through it.'
    /v0/tags/{name}:
        patch:
            tags: []
            summary: Update a tag
            operationId: update_tags_public
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: name
                in: path
                required: true
                schema:
                    type: string
                    description: Name of the tag
                    title: Name
                    example: kubernetes-expenses
                description: Name of the tag
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Body_update_tags_public'
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsOutputPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'Update the color, kinds or description of a tag.


                The tag name cannot be changed. To use a different name, create a
                new tag

                and attach it to the resources.'
        delete:
            tags: []
            summary: Delete a tag
            operationId: delete_tags_public
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: name
                in: path
                required: true
                schema:
                    type: string
                    description: Name of the tag
                    title: Name
                    example: kubernetes-expenses
                description: Name of the tag
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsOutputPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: "Delete a tag by name.\n\nDeletion cannot be undone.\n\n\
                Related commands:\n  mgc tag get --name <name>  check the tag before\
                \ deleting it"
        get:
            tags: []
            summary: Get details of a tag
            operationId: get_tags_public
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: name
                in: path
                required: true
                schema:
                    type: string
                    description: Name of the tag
                    title: Name
                    example: kubernetes-expenses
                description: Name of the tag
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsOutputPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: Get the details of a single tag, including its values.
    /v0/tags/{tag_name}/values:
        post:
            tags:
            - values
            summary: Create a value for a tag
            operationId: create_tag_values_v0_tags__tag_name__values_post
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: tag_name
                in: path
                required: true
                schema:
                    type: string
                    description: Tag name that will own the value
                    title: Tag Name
                description: Tag name that will own the value
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Body_create_tag_values_v0_tags__tag_name__values_post'
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tags_api__api__schemas__public__tag_values__TagValuesOutputPublic'
                    links:
                        list:
                            operationId: list_tag_values_v0_tags__tag_name__values_get
                            description: List the values of a tag
                            parameters:
                                tag_name: $request.path.tag_name
                        get:
                            operationId: get_tag_values_v0_tags__tag_name__values__value_name__get
                            description: Get details of a value
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $request.body#/name
                        update:
                            operationId: update_tag_values_v0_tags__tag_name__values__value_name__patch
                            description: Update the description of a value
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $request.body#/name
                        delete:
                            operationId: delete_tag_values
                            description: Delete a value from a tag
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $request.body#/name
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'Create a value for an existing tag.


                The value name must be unique within the tag.'
        get:
            tags:
            - values
            summary: List the values of a tag
            operationId: list_tag_values_v0_tags__tag_name__values_get
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: tag_name
                in: path
                required: true
                schema:
                    type: string
                    description: Tag name that owns the value
                    title: Tag Name
                description: Tag name that owns the value
            -   name: name
                in: query
                required: false
                schema:
                    description: Name of the value to filter by
                    title: Name
                    nullable: true
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: ^[\w\ \-\[\]\(\)\.\:]+$
                description: Name of the value to filter by
            -   name: _limit
                in: query
                required: false
                schema:
                    type: integer
                    maximum: 100
                    minimum: 1
                    default: 20
                    description: Maximum number of items to return per page
                description: Maximum number of items to return per page
            -   name: _offset
                in: query
                required: false
                schema:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Number of items to skip before the first result
                description: Number of items to skip before the first result
            -   name: _sort
                in: query
                required: false
                schema:
                    type: string
                    default: ''
                    description: Sort criteria for the result
                description: Sort criteria for the result
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagValuesOutputListPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'List every value of a tag.


                Use --name to filter the result, and --control.limit with --control.offset

                to page through it.'
    /v0/tags/{tag_name}/values/{value_name}:
        delete:
            tags:
            - values
            summary: Delete a value from a tag
            operationId: delete_tag_values
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: tag_name
                in: path
                required: true
                schema:
                    type: string
                    description: Tag name that owns the value
                    title: Tag Name
                    example: kubernetes-expenses
                description: Tag name that owns the value
            -   name: value_name
                in: path
                required: true
                schema:
                    type: string
                    description: Value name to operate on
                    title: Value Name
                    example: test-labs
                description: Value name to operate on
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tags_api__api__schemas__public__tag_values__TagValuesOutputPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'Delete a single value from a tag, keeping the tag itself.


                Deletion cannot be undone.'
        patch:
            tags:
            - values
            summary: Update the description of a value
            operationId: update_tag_values_v0_tags__tag_name__values__value_name__patch
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: tag_name
                in: path
                required: true
                schema:
                    type: string
                    description: Tag name that owns the value
                    title: Tag Name
                    example: kubernetes-expenses
                description: Tag name that owns the value
            -   name: value_name
                in: path
                required: true
                schema:
                    type: string
                    description: Value name to operate on
                    title: Value Name
                    example: test-labs
                description: Value name to operate on
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Body_update_tag_values_v0_tags__tag_name__values__value_name__patch'
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tags_api__api__schemas__public__tag_values__TagValuesOutputPublic'
                    links:
                        list:
                            operationId: list_tag_values_v0_tags__tag_name__values_get
                            description: List the values of a tag
                            parameters:
                                tag_name: $request.path.tag_name
                        create:
                            operationId: create_tag_values_v0_tags__tag_name__values_post
                            description: Create a value for a tag
                            parameters:
                                tag_name: $request.path.tag_name
                            x-mgc-wait-termination:
                                interval: 5s
                                maxRetries: 10
                                jsonPathQuery: $.result.description == $.owner.parameters.description
                        get:
                            operationId: get_tag_values_v0_tags__tag_name__values__value_name__get
                            description: Get details of a value
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $response.body#/name
                            x-mgc-wait-termination:
                                interval: 5s
                                maxRetries: 10
                                jsonPathQuery: $.result.description == $.owner.parameters.description
                        delete:
                            operationId: delete_tag_values
                            description: Delete a value from a tag
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $response.body#/name
                            x-mgc-wait-termination:
                                interval: 5s
                                maxRetries: 10
                                jsonPathQuery: $.result.description == $.owner.parameters.description
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'Update the description of a value.


                The value name cannot be changed. To use a different name, create
                a new

                value and delete the old one.'
        get:
            tags:
            - values
            summary: Get details of a value
            operationId: get_tag_values_v0_tags__tag_name__values__value_name__get
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: tag_name
                in: path
                required: true
                schema:
                    type: string
                    description: Tag name that owns the value
                    title: Tag Name
                    example: kubernetes-expenses
                description: Tag name that owns the value
            -   name: value_name
                in: path
                required: true
                schema:
                    type: string
                    description: Value name to operate on
                    title: Value Name
                    example: test-labs
                description: Value name to operate on
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tags_api__api__schemas__public__tag_values__TagValuesOutputPublic'
                    links:
                        list:
                            operationId: list_tag_values_v0_tags__tag_name__values_get
                            description: List the values of a tag
                            parameters:
                                tag_name: $request.path.tag_name
                        create:
                            operationId: create_tag_values_v0_tags__tag_name__values_post
                            description: Create a value for a tag
                            parameters:
                                tag_name: $request.path.tag_name
                        update:
                            operationId: update_tag_values_v0_tags__tag_name__values__value_name__patch
                            description: Update the description of a value
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $response.body#/name
                        update/description:
                            operationId: update_tag_values_v0_tags__tag_name__values__value_name__patch
                            description: Update the description of a value
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $response.body#/name
                            x-mgc-hidden: true
                        delete:
                            operationId: delete_tag_values
                            description: Delete a value from a tag
                            parameters:
                                tag_name: $request.path.tag_name
                                value_name: $response.body#/name
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: Get the details of a single value of a tag.
    /v0/resource-types:
        get:
            tags:
            - resource-types
            summary: List all resource types and their products
            operationId: list_resource_types
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: _limit
                in: query
                required: false
                schema:
                    type: integer
                    maximum: 100
                    minimum: 1
                    description: Maximum number of items to return per page
                    default: 20
                description: Maximum number of items to return per page
            -   name: _offset
                in: query
                required: false
                schema:
                    type: integer
                    minimum: 0
                    description: Number of items to skip before the first result
                    default: 0
                description: Number of items to skip before the first result
            -   name: _sort
                in: query
                required: false
                schema:
                    type: string
                    description: Sort criteria for the result
                    examples: 'created_at:asc

                        create_at:asc,updated_at:desc'
                    default: ''
                description: Sort criteria for the result
            -   name: name
                in: query
                required: false
                schema:
                    description: Resource type to filter by, prefixed by its product
                    title: Name
                    nullable: true
                    $ref: '#/components/schemas/ResourceEnum'
                description: Resource type to filter by, prefixed by its product
            -   name: product
                in: query
                required: false
                schema:
                    description: Product that owns the resource type
                    title: Product
                    nullable: true
                    $ref: '#/components/schemas/ProductEnum'
                description: Product that owns the resource type
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourceTypesOutputListPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'List every resource type that can be tagged, along with
                the product that

                owns it.


                Use one of these values in --resource-type-name when listing resources.'
    /v0/resources/{external_id}:
        get:
            tags:
            - resources
            summary: Get the tags attached to a resource
            operationId: get_resources_public
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: external_id
                in: path
                required: true
                schema:
                    type: string
                    description: External ID of the resource, as used by its own product
                    title: External Id
                    example: 31201f93-f5f4-4cf1-ba9c-bfed0717f4ac
                description: External ID of the resource, as used by its own product
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourcesOutputPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: Get a single resource with the tags and values currently
                attached to it.
    /v0/resources:
        get:
            tags:
            - resources
            summary: List tagged resources
            operationId: list_resources_public
            security:
            -   OAuth2:
                - tags:tags-tr
            parameters:
            -   name: external_id
                in: query
                required: false
                schema:
                    type: string
                    description: External ID of the resource to filter by
                    title: External Id
                    example: 31201f93-f5f4-4cf1-ba9c-bfed0717f4ac
                description: External ID of the resource to filter by
            -   name: resource_type_name
                in: query
                required: false
                schema:
                    $ref: '#/components/schemas/ResourceEnum'
                    description: Resource type to filter by, prefixed by its product
                    example: un.unknown
                description: Resource type to filter by, prefixed by its product
            -   name: region
                in: query
                required: false
                schema:
                    $ref: '#/components/schemas/RegionEnum'
                    description: Region to filter by
                    example: br-se1
                description: Region to filter by
            -   name: _limit
                in: query
                required: false
                schema:
                    type: integer
                    maximum: 100
                    minimum: 1
                    default: 20
                    description: Maximum number of items to return per page
                description: Maximum number of items to return per page
            -   name: _offset
                in: query
                required: false
                schema:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Number of items to skip before the first result
                description: Number of items to skip before the first result
            -   name: _sort
                in: query
                required: false
                schema:
                    type: string
                    default: ''
                    description: Sort criteria for the result
                description: Sort criteria for the result
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourcesOutputListPublic'
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: "List the resources you have access to, with the tags attached\
                \ to each one.\n\nUse --resource-type-name, --region or --external-id\
                \ to filter the result.\n\nRelated commands:\n  mgc tag resource-types\
                \ list  see the values accepted by --resource-type-name"
    /v0/resources/{external_id}/tags:
        post:
            tags:
            - resources
            summary: Attach tags to a resource
            operationId: create_resources_tags_public
            x-mgc-name: attach
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: external_id
                in: path
                required: true
                schema:
                    type: string
                    description: External ID of the resource, as used by its own product
                    title: External Id
                    example: 31201f93-f5f4-4cf1-ba9c-bfed0717f4ac
                description: External ID of the resource, as used by its own product
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResourcesTagsInputPublic'
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourcesOutputPublic'
                    links:
                        detach:
                            operationId: delete_resources_tags_public
                            description: Detach a tag from a resource
                            parameters:
                                external_id: $request.path.external_id
                            x-mgc-wait-termination:
                                interval: 5s
                                maxRetries: 10
                                jsonPathQuery: $.result.tags == $.owner.parameters.tags
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: "Attach one or more tag/value pairs to a resource.\n\nBoth\
                \ the tag and the value must already exist.\n\nRelated commands:\n\
                \  mgc tag create                           create the tag first\n\
                \  mgc tag values create --tag-name <name>  create the value first"
    /v0/resources/{external_id}/tags/{tag_name}:
        delete:
            tags:
            - resources
            summary: Detach a tag from a resource
            operationId: delete_resources_tags_public
            x-mgc-name: detach
            security:
            -   OAuth2:
                - tags:tags-tw
            parameters:
            -   name: tag_name
                in: path
                required: true
                schema:
                    type: string
                    title: Tag Name
                    description: Tag name to detach from the resource
                description: Tag name to detach from the resource
            -   name: external_id
                in: path
                required: true
                schema:
                    type: string
                    description: External ID of the resource, as used by its own product
                    title: External Id
                    example: 31201f93-f5f4-4cf1-ba9c-bfed0717f4ac
                description: External ID of the resource, as used by its own product
            responses:
                '200':
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResourcesOutputPublic'
                    links:
                        attach:
                            operationId: create_resources_tags_public
                            description: Attach tags to a resource
                            parameters:
                                external_id: $request.path.external_id
                '422':
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPValidationError'
            description: 'Detach a tag from a resource.


                The tag itself is not deleted and stays attached to any other resource.'
components:
    schemas:
        Body_create_tag_values_v0_tags__tag_name__values_post:
            properties:
                name:
                    type: string
                    title: Name
                    description: Name of the value, unique within the tag
                description:
                    title: Description
                    description: Description of the value
                    nullable: true
                    type: string
                    maxLength: 500
            type: object
            required:
            - name
            title: Body_create_tag_values_v0_tags__tag_name__values_post
        Body_create_tags_public:
            properties:
                values:
                    title: Values
                    description: Values to create along with the tag
                    nullable: true
                    items:
                        $ref: '#/components/schemas/ComposedTagValuesInput'
                    type: array
                    maxItems: 100
                name:
                    type: string
                    title: Name
                    description: Name of the tag
                    example: kubernetes-expenses
                color:
                    title: Color
